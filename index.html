<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>지나간 시간</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: #333;
      padding: 20px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 50px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 1000px;
      width: 100%;
      animation: fadeInUp 0.8s ease-out;
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .photo-section {
      flex-shrink: 0;
      width: 300px;
      aspect-ratio: 1 / 1;
    }

    .photo-wrapper {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .photo-wrapper:hover img {
      transform: scale(1.05);
    }

    .photo-wrapper::before {
      content: '📷';
      position: absolute;
      font-size: 4rem;
      opacity: 0.3;
      z-index: 0;
    }

    .photo-wrapper img {
      position: relative;
      z-index: 1;
    }

    .content-section {
      flex: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 30px;
      color: #4a5568;
      letter-spacing: -0.5px;
    }

    .time-display {
      margin: 25px 0;
      padding: 25px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      color: white;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .time-display:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
    }

    .time-display h1 {
      font-size: 1.8rem;
      font-weight: 600;
      line-height: 1.6;
      margin: 0;
    }

    .time-display h2 {
      font-size: 1.4rem;
      font-weight: 500;
      line-height: 1.6;
      margin: 0;
      opacity: 0.95;
    }

    .number {
      font-size: 1.2em;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        padding: 30px 20px;
        gap: 30px;
      }

      .photo-section {
        width: 250px;
      }

      .content-section {
        width: 100%;
      }
      
      .title {
        font-size: 1.6rem;
      }
      
      .time-display h1 {
        font-size: 1.4rem;
      }
      
      .time-display h2 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="photo-section">
      <div class="photo-wrapper">
        <img src="./img/yonghyun.jpg" alt="용현이 사진" id="baby-photo">
      </div>
    </div>
    <div class="content-section">
      <div class="icon">👶</div>
      <h1 class="title">용현이의 성장 기록</h1>
      <div class="time-display">
        <h1 id="elapsed">계산 중...</h1>
      </div>
      <div class="time-display">
        <h2 id="daysHours">계산 중...</h2>
      </div>
    </div>
  </div>

  <script>
    const startTime = new Date('2025-11-12T11:35:00');

    function updateElapsedTime() {
      const now = new Date();
      let diff = Math.floor((now - startTime) / 1000); // 총 초

      const totalHours = Math.floor(diff / 3600);
      const minutes = Math.floor((diff % 3600) / 60);
      const seconds = diff % 60;

      // 일 + 시간 계산
      const totalDays = Math.floor(totalHours / 24);
      const remainingHours = totalHours % 24;

      document.getElementById('elapsed').innerHTML =
        `용현이가 태어난 지 <span class="number">${totalHours}</span>시간 <span class="number">${minutes}</span>분 <span class="number">${seconds}</span>초 지났습니다`;

      document.getElementById('daysHours').innerHTML =
        `즉, <span class="number">${totalDays}</span>일 <span class="number">${remainingHours}</span>시간이 지났습니다`;
    }

    setInterval(updateElapsedTime, 1000);
    updateElapsedTime(); // 첫 로딩 시 바로 표시
  </script>
</body>
</html>
